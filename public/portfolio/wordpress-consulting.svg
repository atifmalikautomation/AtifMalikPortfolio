  <rect x="60" y="50" rx="20" ry="20" width="205" height="36" fill="none" stroke="#E0008A" stroke-width="1.5" opacity="0.6"/>
  <text x="162.5" y="74" text-anchor="middle" fill="#E0008A" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="2.5">WEB DEVELOPMENT</text>

  <!-- Main icon -->
  <circle cx="600" cy="220" r="80" fill="#E0008A" opacity="0.08"/>
  <circle cx="600" cy="220" r="55" fill="#E0008A" opacity="0.06"/>
  <g transform="translate(576, 196)" fill="none" stroke="#E0008A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"/>
  </g>

  <!-- Title -->
  <text x="600" y="360" text-anchor="middle" fill="#1A0010" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="800" letter-spacing="-1">Business
WordPress Site</text>
  <text x="600" y="415" text-anchor="middle" fill="#1A0010" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="800" letter-spacing="-1"></text>

  <!-- Tagline -->
  <text x="600" y="465" text-anchor="middle" fill="#E0008A" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" letter-spacing="1" opacity="0.7">WordPress + SEO + Analytics</text>

  <!-- Bottom section -->
  <rect x="0" y="495" width="1200" height="180" fill="#E0008A" opacity="0.03"/>

