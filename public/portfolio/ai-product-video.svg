<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <pattern id="dotgrid" x="0" y="0" width="44" height="44" patternUnits="userSpaceOnUse">
      <circle cx="22" cy="22" r="1.4" fill="#7C3AED" opacity="0.07"/>
    </pattern>
    <filter id="cshadow" x="-8%" y="-8%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="22" flood-color="#000000" flood-opacity="0.07"/>
    </filter>
  </defs>

  <!-- Warm off-white background -->
  <rect width="1200" height="675" fill="#F8F6F3"/>
  <!-- Dot pattern -->
  <rect width="600" height="555" fill="url(#dotgrid)"/>
  <!-- Large soft circle accent left -->
  <circle cx="120" cy="490" r="220" fill="#7C3AED" opacity="0.03"/>

  <!-- Top accent bar -->
  <rect width="1200" height="5" fill="#7C3AED"/>

  <!-- Category pill -->
  <rect x="58" y="42" width="97.6" height="29" rx="14.5" fill="#EDE9FE"/>
  <text x="106.8" y="62" text-anchor="middle" fill="#7C3AED" font-family="system-ui,-apple-system,sans-serif" font-size="10.5" font-weight="800" letter-spacing="2">AI VIDEO</text>

  <!-- Main title -->
  <text x="58" y="158" fill="#0D0D0D" font-family="system-ui,-apple-system,sans-serif" font-size="54" font-weight="800" letter-spacing="-1.5">AI Video</text>
  <text x="58" y="224" fill="#0D0D0D" font-family="system-ui,-apple-system,sans-serif" font-size="54" font-weight="800" letter-spacing="-1.5">Campaign</text>

  <!-- Tagline -->
  <text x="58" y="270" fill="#888" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="500">Veo 3 · Kling · ElevenLabs</text>

  <!-- Horizontal rule -->
  <line x1="58" y1="300" x2="360" y2="300" stroke="#E0DCD7" stroke-width="1"/>

  <!-- Metric rows -->
  <circle cx="64" cy="328" r="4" fill="#7C3AED"/>
    <text x="78" y="333" fill="#0A0A0A" font-family="system-ui,-apple-system,sans-serif" font-size="18" font-weight="800">10×</text>
    <text x="78" y="348" fill="#888" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="500" letter-spacing="0.5">FASTER PROD.</text>
    <circle cx="64" cy="376" r="4" fill="#7C3AED"/>
    <text x="78" y="381" fill="#0A0A0A" font-family="system-ui,-apple-system,sans-serif" font-size="18" font-weight="800">90%</text>
    <text x="78" y="396" fill="#888" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="500" letter-spacing="0.5">COST SAVED</text>
    <circle cx="64" cy="424" r="4" fill="#7C3AED"/>
    <text x="78" y="429" fill="#0A0A0A" font-family="system-ui,-apple-system,sans-serif" font-size="18" font-weight="800">5 min</text>
    <text x="78" y="444" fill="#888" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="500" letter-spacing="0.5">PER VIDEO</text>

  <!-- Tech tags -->
  <rect x="58" y="468" width="59.5" height="26" rx="13" fill="none" stroke="#7C3AED" stroke-width="1.2" opacity="0.55"/>
    <text x="87.75" y="485" text-anchor="middle" fill="#7C3AED" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="600">Veo 3</text>
    <rect x="126.5" y="468" width="82" height="26" rx="13" fill="none" stroke="#7C3AED" stroke-width="1.2" opacity="0.55"/>
    <text x="167.5" y="485" text-anchor="middle" fill="#7C3AED" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="600">Kling AI</text>
    <rect x="217.5" y="468" width="97" height="26" rx="13" fill="none" stroke="#7C3AED" stroke-width="1.2" opacity="0.55"/>
    <text x="266" y="485" text-anchor="middle" fill="#7C3AED" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="600">ElevenLabs</text>

  <!-- ── RIGHT SIDE CARD ── -->
  <rect x="640" y="28" width="518" height="497" rx="22" fill="white" filter="url(#cshadow)"/>

  <!-- Card colored header -->
  <rect x="640" y="28" width="518" height="54" rx="22" fill="#7C3AED"/>
  <rect x="640" y="58" width="518" height="24" fill="#7C3AED"/>

  <!-- Window chrome dots -->
  <circle cx="671" cy="55" r="5.5" fill="white" opacity="0.35"/>
  <circle cx="693" cy="55" r="5.5" fill="white" opacity="0.35"/>
  <circle cx="715" cy="55" r="5.5" fill="white" opacity="0.35"/>

  <!-- URL bar placeholder -->
  <rect x="740" y="46" width="180" height="12" rx="6" fill="white" opacity="0.2"/>

  <!-- Icon display area -->
  <circle cx="899" cy="230" r="108" fill="#7C3AED" opacity="0.07"/>
  <circle cx="899" cy="230" r="74" fill="#EDE9FE" opacity="0.9"/>

  <!-- SVG icon scaled 2.2× centered at 899,230 (icon drawn in 24×24 box) -->
  <g transform="translate(872.6,203.6) scale(2.2)" fill="none" stroke="#7C3AED" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/>
  </g>

  <!-- Separator -->
  <line x1="658" y1="380" x2="1140" y2="380" stroke="#F0EBE5" stroke-width="1"/>

  <!-- 3 metric cards inside the card -->
  <rect x="642" y="405" width="116" height="72" rx="12" fill="#EDE9FE"/>
    <text x="700" y="438" text-anchor="middle" fill="#7C3AED" font-family="system-ui,-apple-system,sans-serif" font-size="24" font-weight="800">10×</text>
    <text x="700" y="457" text-anchor="middle" fill="#777" font-family="system-ui,-apple-system,sans-serif" font-size="10" font-weight="700" letter-spacing="0.8">FASTER PROD.</text>
    <rect x="797" y="405" width="116" height="72" rx="12" fill="#EDE9FE"/>
    <text x="855" y="438" text-anchor="middle" fill="#7C3AED" font-family="system-ui,-apple-system,sans-serif" font-size="24" font-weight="800">90%</text>
    <text x="855" y="457" text-anchor="middle" fill="#777" font-family="system-ui,-apple-system,sans-serif" font-size="10" font-weight="700" letter-spacing="0.8">COST SAVED</text>
    <rect x="952" y="405" width="116" height="72" rx="12" fill="#EDE9FE"/>
    <text x="1010" y="438" text-anchor="middle" fill="#7C3AED" font-family="system-ui,-apple-system,sans-serif" font-size="24" font-weight="800">5 min</text>
    <text x="1010" y="457" text-anchor="middle" fill="#777" font-family="system-ui,-apple-system,sans-serif" font-size="10" font-weight="700" letter-spacing="0.8">PER VIDEO</text>

  <!-- Bottom "Live Demo" button inside card -->
  <rect x="658" y="492" width="150" height="18" rx="9" fill="#EDE9FE" opacity="0.7"/>
  <text x="733" y="505" text-anchor="middle" fill="#7C3AED" font-family="system-ui,-apple-system,sans-serif" font-size="10.5" font-weight="700">Live Demo Available →</text>

  <!-- ── DARK BOTTOM BAR ── -->
  <rect y="555" width="1200" height="120" fill="#0D0D0D"/>
  <!-- Pink accent line -->
  <rect y="555" width="1200" height="2.5" fill="#E0008A"/>

  <!-- AM Avatar -->
  <rect x="50" y="575" width="58" height="58" rx="13" fill="#E0008A"/>
  <text x="79" y="611" text-anchor="middle" fill="white" font-family="system-ui,-apple-system,sans-serif" font-size="19" font-weight="800">AM</text>

  <!-- Name + subtitle -->
  <text x="124" y="597" fill="white" font-family="system-ui,-apple-system,sans-serif" font-size="17" font-weight="700">Atif Malik</text>
  <text x="124" y="618" fill="#E0008A" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="600" letter-spacing="1.8">AI VIDEO &amp; AUTOMATION</text>

  <!-- Separator dot -->
  <circle cx="318" cy="605" r="2.5" fill="#3a3a3a"/>

  <!-- Category label in bar -->
  <rect x="330" y="590" width="77" height="28" rx="14" fill="#7C3AED" opacity="0.18"/>
  <text x="369" y="609" text-anchor="middle" fill="#7C3AED" font-family="system-ui,-apple-system,sans-serif" font-size="10" font-weight="800" letter-spacing="1.5">AI VIDEO</text>

  <!-- Website URL right side -->
  <circle cx="1158" cy="601" r="3.5" fill="#E0008A" opacity="0.55"/>
  <text x="1148" y="606" text-anchor="end" fill="#555" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="500">atifmalik.me</text>
</svg>