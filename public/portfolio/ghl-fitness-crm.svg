    <line x1="840" y1="0" x2="840" y2="675"/>
    <line x1="900" y1="0" x2="900" y2="675"/>
    <line x1="960" y1="0" x2="960" y2="675"/>
    <line x1="1020" y1="0" x2="1020" y2="675"/>
    <line x1="1080" y1="0" x2="1080" y2="675"/>
    <line x1="1140" y1="0" x2="1140" y2="675"/>
    <line x1="0" y1="0" x2="1200" y2="0"/>
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="0" y1="660" x2="1200" y2="660"/>
  </g>

  <!-- Accent glow circle -->
  <circle cx="900" cy="340" r="250" fill="#d6d3d1" opacity="0.07"/>
  <circle cx="200" cy="100" r="150" fill="#d6d3d1" opacity="0.04"/>

  <!-- Icon circle -->
  <circle cx="600" cy="240" r="60" fill="white" opacity="0.08"/>
  <g transform="translate(576, 216)" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.7">
    <path d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
  </g>

  <!-- Category pill -->
  <rect x="460" y="330" rx="14" ry="14" width="280" height="28" fill="#d6d3d1" opacity="0.2"/>
  <text x="600" y="349" text-anchor="middle" fill="#d6d3d1" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="3" text-transform="uppercase">LEAD AUTOMATION</text>

  <!-- Title -->
  <text x="600" y="415" text-anchor="middle" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="800" letter-spacing="-0.5">Fitness Studio CRM</text>

  <!-- Bottom line -->
  <rect x="500" y="460" width="200" height="2" rx="1" fill="#d6d3d1" opacity="0.4"/>

  <!-- Brand -->
  <text x="600" y="510" text-anchor="middle" fill="white" opacity="0.35" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" letter-spacing="4">ATIF MALIK</text>

  <!-- Bottom accent bar -->
  <rect x="0" y="670" width="1200" height="5" fill="#d6d3d1" opacity="0.5"/>
